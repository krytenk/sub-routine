html/head_include="<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">\n<meta http-equiv=\"Pragma\" content=\"no-cache\">\n<meta http-equiv=\"Expires\" content=\"0\">\n<script>\nwindow._audioContexts = [];\n(function() {\n\tvar OrigAudioContext = window.AudioContext || window.webkitAudioContext;\n\tif (OrigAudioContext) {\n\t\tvar PatchedAudioContext = function() {\n\t\t\tvar ctx = new OrigAudioContext();\n\t\t\twindow._audioContexts.push(ctx);\n\t\t\treturn ctx;\n\t\t};\n\t\tPatchedAudioContext.prototype = OrigAudioContext.prototype;\n\t\twindow.AudioContext = PatchedAudioContext;\n\t\tif (window.webkitAudioContext) window.webkitAudioContext = PatchedAudioContext;\n\t}\n\twindow.resumeAllAudio = function() {\n\t\tif (window._audioContexts) {\n\t\t\twindow._audioContexts.forEach(function(ctx) {\n\t\t\t\tif (ctx && ctx.state === 'suspended') {\n\t\t\t\t\tctx.resume().then(function() {\n\t\t\t\t\t\tconsole.log('[Sub-Routine WebAudio] AudioContext resumed successfully!');\n\t\t\t\t\t});\n\t\t\t\t}\n\t\t\t});\n\t\t}\n\t};\n\t['click', 'keydown', 'pointerdown', 'touchstart', 'mousedown'].forEach(function(evt) {\n\t\twindow.addEventListener(evt, window.resumeAllAudio, { passive: true });\n\t});\n\tvar origFetch = window.fetch;\n\twindow.fetch = function(input, init) {\n\t\tif (typeof input === 'string' && (input.indexOf('.pck') !== -1 || input.indexOf('.wasm') !== -1)) {\n\t\t\tinit = init || {};\n\t\t\tinit.cache = 'no-store';\n\t\t}\n\t\treturn origFetch.call(this, input, init);\n\t};\n})();\n</script>"
